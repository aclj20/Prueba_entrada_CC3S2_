version: '3.7'

services:
  web:
      build: .
      ports:
      - "8000:80"
      
      volumes:
      - .:/app

      depends_on:
      - db
  
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: