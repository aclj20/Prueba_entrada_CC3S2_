version: '3.7'

services:
  juego:
      build: .
      volumes:
        - .:/app
      stdin_open: true
      tty: true
      depends_on:
        - db
        - api 

      environment:
        - DATABASE_URL=${DATABASE_URL}
        - SECRET_KEY=${SECRET_KEY}

      env_file:
        - .env
      command: python trivia.py
      networks:
        - trivia-net
    
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    networks:
        - trivia-net
  
  db:
    image: postgres:15
    restart: always
    container_name: postgres_db
    environment:
      POSTGRES_USER: arianaLopez
      POSTGRES_PASSWORD: password
      POSTGRES_DB: trivia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
        - trivia-net

volumes:
  postgres_data:

networks:
  trivia-net:
    driver: bridge